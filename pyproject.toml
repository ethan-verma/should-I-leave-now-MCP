[project]
name = "leavenow"
version = "0.1.0"
description = "MCP server that tells you when to leave, using live Google transit, traffic and weather data."
readme = "README.md"
authors = [
    { name = "Ethan Verma" }
]
requires-python = ">=3.12"
dependencies = [
    "baton-sdk[http]>=1.3.0",
    "google-cloud-firestore>=2.19",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pyjwt[crypto]>=2.9",
    "tzdata>=2026.6",
]

[project.scripts]
leavenow = "leavenow.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
